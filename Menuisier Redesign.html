const FURNITURE_TYPES = [
  { id: 'bibliotheque', name: 'Bibliothèque',      desc: 'Livres, objets déco'       },
  { id: 'dressing',     name: 'Dressing',           desc: 'Vêtements, penderie'       },
  { id: 'placard',      name: 'Placard',             desc: 'Rangement polyvalent'      },
  { id: 'meuble_tv',    name: 'Meuble TV',           desc: 'Audiovisuel, câbles'       },
  { id: 'commode',      name: 'Commode',             desc: 'Tiroirs, linge plié'       },
  { id: 'cuisine_bas',  name: 'Cuisine',             desc: 'Caissons bas'              },
  { id: 'bureau',       name: 'Bureau',              desc: 'Poste de travail'          },
  { id: 'etagere',      name: 'Étagère',             desc: 'Murale ou sur pied'        },

// ─── SHARED COMPONENTS ────────────────────────────────────────────────────

function Tag({ children, color = 'neutral', T }) {
  const map = {
    neutral: { bg: T.surfaceAlt, border: T.border, text: T.text2 },
    accent:  { bg: T.accentLight, border: 'transparent', text: T.accent },
    success: { bg: T.successLight, border: 'transparent', text: T.success },
    warning: { bg: T.warningLight, border: 'transparent', text: T.warning },
    error:   { bg: T.errorLight, border: 'transparent', text: T.error },
  };
  const c = map[color] || map.neutral;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center',
      background: c.bg, border: `1px solid ${c.border}`, color: c.text,
      borderRadius: 4, padding: '2px 8px', fontSize: 11, fontWeight: 500,
      letterSpacing: '0.01em', whiteSpace: 'nowrap',
    }}>{children}</span>
  );
}

function Btn({ children, variant = 'ghost', onClick, full, small, T, styleOverride }) {
  const variants = {
    primary: { bg: T.accent, color: T.accentText, border: 'transparent' },
    ghost:   { bg: 'transparent', color: T.text2, border: T.border },
    muted:   { bg: T.surfaceAlt, color: T.text2, border: T.border },
  };
  const v = variants[variant] || variants.ghost;
  return (
    <button onClick={onClick} style={{
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6,
      background: v.bg, color: v.color,
      border: `1px solid ${v.border}`, borderRadius: 8,
      padding: small ? '6px 12px' : '9px 16px',
      fontSize: small ? 12 : 13, fontWeight: 500, cursor: 'pointer',
      width: full ? '100%' : undefined,
      fontFamily: 'inherit', transition: 'opacity .12s',
      ...styleOverride,
    }}
    onMouseEnter={e => e.currentTarget.style.opacity = '.8'}
    onMouseLeave={e => e.currentTarget.style.opacity = '1'}
    >{children}</button>
  );
}

function Divider({ T }) {
  return <div style={{ height: 1, background: T.border, margin: '0 -20px' }} />;
}

function CloseBtn({ onClick, T }) {
  return (
    <button onClick={onClick} style={{
      width: 44, height: 44, display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'transparent', border: 'none', cursor: 'pointer', borderRadius: 8, flexShrink: 0,
      color: T.text3, fontSize: 18, lineHeight: 1, fontFamily: 'inherit',
    }}>×</button>
  );
}

// ─── SCREEN: HOME ────────────────────────────────────────────────────────
const TABS = [

  { key: 'notice',    label: 'Notice'    },

            <Btn T={T} variant="muted" full>+ Ajouter un corps</Btn>

        {activeTab !== 'structure' && (

          <div>

              Étape 1 / 3
            </div>
            <div style={{ fontSize: 16, fontWeight: 600, color: T.text }}>Type de meuble</div>
          </div>
          <CloseBtn onClick={() => onNavigate('home')} T={T} />
        </div>
        {/* Progress bar */}
        <div style={{ height: 2, background: T.border, borderRadius: 2, marginTop: 14 }}>
          <div style={{ height: '100%', width: '33%', background: T.accent, borderRadius: 2, transition: 'width .3s' }} />
        </div>
      </div>

      {/* Grid */}
      <div style={{ flex: 1, overflow: 'auto', padding: 20 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          {FURNITURE_TYPES.map(ft => {
            const Icon = FurnitureIcons[ft.id] || FurnitureIcons.etagere;
            const isSelected = selected === ft.id;
            return (
              <button key={ft.id} onClick={() => setSelected(ft.id)} style={{
                background: isSelected ? T.accentLight : T.surface,
                border: `${isSelected ? 2 : 1}px solid ${isSelected ? T.accent : T.border}`,
                borderRadius: 10, padding: '16px 12px', cursor: 'pointer',
                display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10,
                transition: 'all .12s', textAlign: 'center', fontFamily: 'inherit',
              }}>
                <div style={{ color: isSelected ? T.accent : T.text3, display: 'flex', alignItems: 'center', justifyContent: 'center', height: 48 }}>
                  <Icon />
                </div>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: isSelected ? T.accent : T.text, marginBottom: 2 }}>{ft.name}</div>
                  <div style={{ fontSize: 11, color: T.text3 }}>{ft.desc}</div>
                </div>
              </button>
            );
          })}
        </div>

        {/* AI brief toggle */}
        <div style={{ marginTop: 14, padding: '12px 16px', background: T.surface, border: `1px solid ${T.border}`, borderRadius: 10 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: T.text, marginBottom: 4 }}>Décrire librement</div>
          <div style={{ fontSize: 11, color: T.text3, marginBottom: 10 }}>
            Décrivez votre projet en langage naturel — l'assistant génère plusieurs propositions.

            width: '100%', height: 72, resize: 'none',
            border: `1px solid ${T.border}`, borderRadius: 8,
            padding: '8px 10px', fontSize: 12, color: T.text,

            outline: 'none',
          }} />

            <Btn T={T} variant="muted" full small>Générer des propositions</Btn>

// Type dot color
function typeDot(type, T) {
  const map = { Joue: T.accent, Fixe: T.text2, Réglable: T.success, Fond: T.text3 };
  return map[type] || T.text3;
}

// Facade SVG — cotée, 2 corps
function FacadeSVG({ T }) {
  const W = 320, H = 160;
  const ml = 28, mr = 16, mt = 12, mb = 24;
  const fw = W - ml - mr, fh = H - mt - mb;
  // 2 corps de 1200mm, hauteur 2320mm — proportion 2400:2320 ≈ 1.034
  const cx = ml + fw / 2; // separator x
  // shelves at ~30%, 52%, 70%, 84% of height
  const shelves = [0.28, 0.50, 0.68, 0.82].map(r => mt + r * fh);
  const dimY = H - 8;
  const dimX = ml - 8;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width={W} height={H} style={{ display: 'block' }}>
      {/* Fill */}
      <rect x={ml} y={mt} width={fw} height={fh} fill={T.accentLight} rx="1"/>
      {/* Outer frame */}
      <rect x={ml} y={mt} width={fw} height={fh} stroke={T.accent} strokeWidth="2" fill="none" rx="1"/>
      {/* Centre separator */}
      <line x1={cx} y1={mt} x2={cx} y2={mt + fh} stroke={T.accentMuted} strokeWidth="1.5"/>
      {/* Shelves */}
      {shelves.map((sy, i) => (
        <line key={i} x1={ml + 2} y1={sy} x2={ml + fw - 2} y2={sy} stroke={T.accentMuted} strokeWidth="1" strokeDasharray="0"/>
      ))}
      {/* Bottom plinth line */}
      <line x1={ml} y1={mt + fh - 6} x2={ml + fw} y2={mt + fh - 6} stroke={T.accentMuted} strokeWidth="0.8" strokeDasharray="3 2"/>

      {/* Width dimension */}
      <line x1={ml} y1={dimY} x2={ml + fw} y2={dimY} stroke={T.text3} strokeWidth="0.8"/>
      <line x1={ml} y1={dimY - 3} x2={ml} y2={dimY + 3} stroke={T.text3} strokeWidth="0.8"/>
      <line x1={ml + fw} y1={dimY - 3} x2={ml + fw} y2={dimY + 3} stroke={T.text3} strokeWidth="0.8"/>
      <text x={ml + fw / 2} y={H - 1} textAnchor="middle" fontSize="8" fill={T.text3} fontFamily="DM Mono, monospace">2400 mm</text>

      {/* Height dimension */}
      <line x1={dimX} y1={mt} x2={dimX} y2={mt + fh} stroke={T.text3} strokeWidth="0.8"/>
      <line x1={dimX - 3} y1={mt} x2={dimX + 3} y2={mt} stroke={T.text3} strokeWidth="0.8"/>
      <line x1={dimX - 3} y1={mt + fh} x2={dimX + 3} y2={mt + fh} stroke={T.text3} strokeWidth="0.8"/>
      <text x={dimX - 3} y={mt + fh / 2} textAnchor="middle" fontSize="7" fill={T.text3} fontFamily="DM Mono, monospace" transform={`rotate(-90 ${dimX - 3} ${mt + fh / 2})`}>2320</text>

      {/* Corps labels */}
      <text x={ml + fw * 0.25} y={mt + 11} textAnchor="middle" fontSize="7.5" fill={T.accent} fontFamily="DM Mono, monospace" fontWeight="500">Corps 1</text>
      <text x={ml + fw * 0.75} y={mt + 11} textAnchor="middle" fontSize="7.5" fill={T.accent} fontFamily="DM Mono, monospace" fontWeight="500">Corps 2</text>
    </svg>
  );
}

                <text x="110" y="70" textAnchor="middle" fontSize="8" fill={T.accent} fontFamily="DM Mono, monospace">meuble</text>

                <text x="177" y="17" textAnchor="start" fontSize="7" fill={T.text3} fontFamily="DM Mono, monospace">Prof.</text>
              </svg>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              <MiniField label="Largeur" value={2400} unit="mm" T={T} />
              <MiniField label="Hauteur" value={2500} unit="mm" T={T} />
              <MiniField label="Profondeur" value={600} unit="mm" T={T} />
              <MiniField label="Plinthe" value={80} unit="mm" T={T} />
            </div>
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: T.text3, letterSpacing: '0.05em', textTransform: 'uppercase', marginBottom: 8 }}>Type de mur</div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {['Béton', 'Brique', 'Placo', 'Inconnu'].map((w, i) => (
                  <button key={w} style={{
                    padding: '7px 14px', fontSize: 12, fontWeight: i === 0 ? 600 : 400,
                    border: `1px solid ${i === 0 ? T.accent : T.border}`, borderRadius: 8,
                    background: i === 0 ? T.accentLight : T.surface, color: i === 0 ? T.accent : T.text2,
                    cursor: 'pointer', fontFamily: 'inherit',
                  }}>{w}</button>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* STEP 3 — Préférences */}
        {step === 3 && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
            <p style={{ fontSize: 12, color: T.text2, lineHeight: 1.6 }}>
              Quelques préférences pour affiner les propositions.
            </p>
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: T.text3, letterSpacing: '0.05em', textTransform: 'uppercase', marginBottom: 10 }}>Style</div>
              <div style={{ display: 'flex', gap: 8 }}>
                {[
                  { id: 'minimal', label: 'Minimaliste', sub: 'Lignes épurées' },
                  { id: 'classique', label: 'Classique', sub: 'Proportions équilibrées' },
                  { id: 'artisan', label: 'Artisanal', sub: 'Bois naturel visible' },
                ].map(s => (
                  <ChoiceChip key={s.id} label={s.label} sub={s.sub} selected={style === s.id} onClick={() => setStyle(s.id)} T={T} />
                ))}
              </div>
            </div>
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: T.text3, letterSpacing: '0.05em', textTransform: 'uppercase', marginBottom: 10 }}>Budget</div>
              <div style={{ display: 'flex', gap: 8 }}>
                {[
                  { id: 'eco', label: 'Serré', sub: '< 200 €' },
                  { id: 'std', label: 'Standard', sub: '200–400 €' },
                  { id: 'prem', label: 'Premium', sub: '400 € +' },
                ].map(b => (
                  <ChoiceChip key={b.id} label={b.label} sub={b.sub} selected={budget === b.id} onClick={() => setBudget(b.id)} T={T} />
                ))}
              </div>
            </div>
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: T.text3, letterSpacing: '0.05em', textTransform: 'uppercase', marginBottom: 10 }}>Niveau</div>
              <div style={{ display: 'flex', gap: 8 }}>
                {[
                  { id: 'debut', label: 'Débutant', sub: 'Outils basiques' },
                  { id: 'inter', label: 'Confirmé', sub: 'Scie circulaire' },
                  { id: 'pro', label: 'Expert', sub: 'Atelier complet' },
                ].map(n => (
                  <ChoiceChip key={n.id} label={n.label} sub={n.sub} selected={niveau === n.id} onClick={() => setNiveau(n.id)} T={T} />
                ))}
              </div>
            </div>
          </div>
        )}

        {/* STEP 4 — Résultats */}
        {step === 4 && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            {loading ? (
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 20, padding: '40px 0' }}>
                {/* Animated loader */}
                <div style={{ position: 'relative', width: 64, height: 64 }}>
                  <svg viewBox="0 0 64 64" width="64" height="64">
                    <circle cx="32" cy="32" r="26" stroke={T.border} strokeWidth="3" fill="none"/>
                    <circle cx="32" cy="32" r="26" stroke={T.accent} strokeWidth="3" fill="none"
                      strokeDasharray="40 124" strokeLinecap="round">
                      <animateTransform attributeName="transform" type="rotate"
                        from="0 32 32" to="360 32 32" dur="1s" repeatCount="indefinite"/>
                    </circle>
                  </svg>
                </div>
                <div style={{ textAlign: 'center' }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: T.text, marginBottom: 6 }}>Calcul en cours…</div>
                  <div style={{ fontSize: 12, color: T.text3 }}>Analyse du contenu, dimensionnement des zones,<br/>optimisation de la découpe</div>
                </div>
                {/* Progress steps */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6, width: '100%' }}>
                  {['Analyse du contenu à ranger', 'Dimensionnement des zones', 'Calcul des pièces', 'Optimisation découpe'].map((s, i) => (
                    <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, opacity: i < 2 ? 1 : 0.35 }}>
                      <div style={{ width: 16, height: 16, borderRadius: '50%', background: i < 2 ? T.success : T.border, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        {i < 2 && <span style={{ fontSize: 9, color: '#fff', fontWeight: 700 }}>✓</span>}
                      </div>
                      <span style={{ fontSize: 11, color: i < 2 ? T.text : T.text3 }}>{s}</span>
                    </div>
                  ))}
                </div>
              </div>
            ) : showVariants && (
              <div>
                <p style={{ fontSize: 12, color: T.text2, marginBottom: 14, lineHeight: 1.6 }}>
                  3 propositions générées d'après votre contenu et vos préférences.
                </p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                  {VARIANTS_DATA.map((v, i) => (
                    <div key={i} style={{
                      background: chosen === i ? T.accentLight : T.surface,
                      border: `${chosen === i ? 2 : 1}px solid ${chosen === i ? T.accent : T.border}`,
                      borderRadius: 12, overflow: 'hidden', transition: 'all .15s',
                    }}>
                      <div style={{ padding: '14px 16px', display: 'flex', gap: 14, alignItems: 'flex-start' }}>
                        {/* Mini SVG */}
                        <div style={{ flexShrink: 0, opacity: chosen === i ? 1 : 0.7 }}>
                          <MiniVariantSVG v={v} T={T} />
                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 13, fontWeight: 700, color: chosen === i ? T.accent : T.text, marginBottom: 4 }}>{v.title}</div>
                          <div style={{ fontSize: 11, color: T.text2, lineHeight: 1.5, marginBottom: 8 }}>{v.desc}</div>
                          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                            <span style={{ fontSize: 10, color: T.text3, fontFamily: T.mono }}>{v.corps} corps · {v.pieces} pcs</span>
                            <span style={{ fontSize: 10, fontWeight: 600, color: T.accent, fontFamily: T.mono }}>~{v.cout} €</span>
                            <span style={{ fontSize: 10, color: T.text3 }}>{v.difficulte}</span>
                          </div>
                        </div>
                      </div>
                      <div style={{ borderTop: `1px solid ${T.border}`, padding: '10px 16px', display: 'flex', justifyContent: 'flex-end' }}>
                        <button
                          onClick={() => setChosen(i)}
                          style={{
                            padding: '7px 16px', borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: 'pointer',
                            fontFamily: 'inherit', border: 'none', transition: 'all .12s',
                            background: chosen === i ? T.accent : T.surfaceAlt,
                            color: chosen === i ? T.accentText : T.text2,
                          }}
                        >{chosen === i ? '✓ Sélectionnée' : 'Choisir'}</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Footer */}
      <div style={{ background: T.surface, borderTop: `1px solid ${T.border}`, padding: '12px 20px', display: 'flex', gap: 8, flexShrink: 0 }}>
        {step > 1 && !loading && (
          <Btn T={T} variant="ghost" onClick={() => { setStep(s => s - 1); setShowVariants(false); }}>← Retour</Btn>
        )}
        <div style={{ flex: 1 }} />
        {step === 1 && !hasContent && (
          <button onClick={() => setStep(2)} style={{
            background: 'none', border: 'none', fontSize: 11, color: T.text3,
            textDecoration: 'underline dotted', cursor: 'pointer', padding: 0, fontFamily: 'inherit',
          }}>Ignorer le contenu</button>
        )}
        {step === 1 && (
          <Btn T={T} variant="primary" small
            onClick={hasContent ? () => setStep(2) : undefined}
            styleOverride={!hasContent ? { background: T.border, color: T.text3, cursor: 'default', pointerEvents: 'none' } : undefined}>
            {hasContent ? `Continuer (${totalItems} élément${totalItems > 1 ? 's' : ''})` : `Continuer (0 éléments)`}
          </Btn>
        )}
        {step === 2 && (
          <Btn T={T} variant="primary" small onClick={() => setStep(3)}>Continuer</Btn>
        )}
        {step === 3 && (
          <Btn T={T} variant="primary" small onClick={handleGenerate}>
            Générer les propositions
          </Btn>
        )}
        {step === 4 && !loading && chosen !== null && (
          <Btn T={T} variant="primary" small onClick={() => onNavigate('dashboard')}>
            Continuer avec cette variante →
          </Btn>
        )}
      </div>
    </div>
  );
}

  const screenMap = {
    home:           <HomeScreen onNavigate={setScreen} T={T} />,
    'new-project':  <NewProjectScreen onNavigate={setScreen} T={T} />,
    'wizard-type':  <WizardTypeScreen onNavigate={setScreen} T={T} />,

    'brief-ia':     <BriefIAScreen onNavigate={setScreen} T={T} />,
    settings:       <SettingsScreen T={T} />,

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '32px 24px 40px', minWidth: compare ? 1100 : 'auto' }}>
      <div style={{ marginBottom: 20, fontSize: 11, color: 'rgba(255,255,255,.3)', letterSpacing: '0.1em', textTransform: 'uppercase', fontFamily: 'DM Sans, sans-serif' }}>
        Menuisier — Redesign Direction
      </div>

      {compare ? (
        <CompareView screen={screen} />
      ) : (
        <PhoneShell T={T} activeScreen={screen} onNavigate={setScreen}>
          {screenMap[screen] || screenMap.home}
        </PhoneShell>
      )}

      <NavPills
        screen={screen}
        onNavigate={setScreen}
        compare={compare}
        onToggleCompare={() => setCompare(c => !c)}
        T={T}
      />

      <TweaksPanel>
        <TweakSection label="Couleur d'accent" />
        <TweakRadio
          label="Accent"
          value={tweaks.accent}
          options={Object.keys(ACCENTS)}
          onChange={(v) => setTweak('accent', v)}
        />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
