<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#18181b"/>
  <!-- Bookshelf outline -->
  <rect x="80" y="60" width="352" height="392" rx="12" fill="none" stroke="#d97706" stroke-width="16"/>
  <!-- Left side -->
  <rect x="80" y="60" width="40" height="392" rx="4" fill="#d97706" opacity="0.3"/>
  <!-- Right side -->
  <rect x="392" y="60" width="40" height="392" rx="4" fill="#d97706" opacity="0.3"/>
  <!-- Fixed shelf top -->
  <rect x="120" y="120" width="272" height="14" rx="3" fill="#10b981" opacity="0.7"/>
  <!-- Fixed shelf bottom -->
  <rect x="120" y="370" width="272" height="14" rx="3" fill="#10b981" opacity="0.7"/>
  <!-- Adjustable shelves -->
  <line x1="130" y1="200" x2="382" y2="200" stroke="#f59e0b" stroke-width="6" stroke-dasharray="12,8" opacity="0.6"/>
  <line x1="130" y1="280" x2="382" y2="280" stroke="#f59e0b" stroke-width="6" stroke-dasharray="12,8" opacity="0.6"/>
  <!-- Books hint -->
  <rect x="145" y="140" width="20" height="55" rx="3" fill="#60a5fa" opacity="0.5"/>
  <rect x="170" y="145" width="16" height="50" rx="3" fill="#a78bfa" opacity="0.5"/>
  <rect x="191" y="138" width="22" height="57" rx="3" fill="#f472b6" opacity="0.4"/>
  <rect x="218" y="142" width="18" height="53" rx="3" fill="#34d399" opacity="0.5"/>
  <!-- "M" text -->
  <text x="256" y="480" text-anchor="middle" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="#d97706" opacity="0.6">MENUISIER</text>
</svg>
